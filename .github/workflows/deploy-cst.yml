name: Deploy CST Production

on:
  push:
    branches:
      - feature-v2

  workflow_dispatch:

concurrency:
  group: cst-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy CST Production
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. DETECTION DES COMPOSANTS MODIFIES
      # ============================================================
      - name: Detect changed components
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail

          BACKEND=false
          FRONTEND=false
          GATEWAY=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Déploiement manuel : tous les composants seront déployés."

            BACKEND=true
            FRONTEND=true
            GATEWAY=true
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${GITHUB_SHA}"

            if [ -z "${BEFORE}" ] || \
               echo "${BEFORE}" | grep -Eq '^0+$' || \
               ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then

              BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || true)"
            fi

            echo "Commit précédent : ${BEFORE:-inconnu}"
            echo "Nouveau commit   : ${AFTER}"

            if [ -n "${BEFORE}" ]; then
              CHANGED_FILES="$(git diff --name-only "${BEFORE}" "${AFTER}")"
            else
              CHANGED_FILES="$(git show --pretty='' --name-only "${AFTER}")"
            fi

            echo
            echo "===== FICHIERS MODIFIÉS ====="
            echo "${CHANGED_FILES}"
            echo "============================="

            if grep -Eq '^backend/' <<< "${CHANGED_FILES}"; then
              BACKEND=true
            fi

            if grep -Eq '^frontend/' <<< "${CHANGED_FILES}"; then
              FRONTEND=true
            fi

            if grep -Eq '^(gateway/|nginx/)' <<< "${CHANGED_FILES}"; then
              GATEWAY=true
            fi

            # Une modification Docker peut toucher les Dockerfiles,
            # Compose, réseaux ou configurations partagées.
            if grep -Eq '^docker/' <<< "${CHANGED_FILES}"; then
              BACKEND=true
              FRONTEND=true
              GATEWAY=true
            fi

            if grep -Eq '^\.dockerignore$' <<< "${CHANGED_FILES}"; then
              BACKEND=true
              FRONTEND=true
              GATEWAY=true
            fi
          fi

          echo "backend=${BACKEND}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${FRONTEND}" >> "${GITHUB_OUTPUT}"
          echo "gateway=${GATEWAY}" >> "${GITHUB_OUTPUT}"

          echo
          echo "===== PLAN DE DÉPLOIEMENT ====="
          echo "Backend  : ${BACKEND}"
          echo "Frontend : ${FRONTEND}"
          echo "Gateway  : ${GATEWAY}"
          echo "================================"

          {
            echo "## Plan de déploiement CST"
            echo
            echo "| Composant | Déploiement |"
            echo "|---|---|"
            echo "| Backend | ${BACKEND} |"
            echo "| Frontend | ${FRONTEND} |"
            echo "| Gateway | ${GATEWAY} |"
            echo
            echo "Commit : \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ============================================================
      # 3. SSH
      # ============================================================
      - name: Prepare SSH
        shell: bash
        env:
          CST_VPS_SSH_KEY: ${{ secrets.CST_VPS_SSH_KEY }}
          CST_VPS_KNOWN_HOSTS: ${{ secrets.CST_VPS_KNOWN_HOSTS }}
          CST_VPS_HOST: ${{ secrets.CST_VPS_HOST }}
          CST_VPS_PORT: ${{ secrets.CST_VPS_PORT }}
          CST_VPS_USER: ${{ secrets.CST_VPS_USER }}
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          test -n "${CST_VPS_SSH_KEY}"
          test -n "${CST_VPS_KNOWN_HOSTS}"
          test -n "${CST_VPS_HOST}"
          test -n "${CST_VPS_PORT}"
          test -n "${CST_VPS_USER}"

          printf "%s\n" "${CST_VPS_SSH_KEY}" > ~/.ssh/cst_vps_key
          sed -i 's/\r$//' ~/.ssh/cst_vps_key
          chmod 600 ~/.ssh/cst_vps_key

          ssh-keygen -y \
            -f ~/.ssh/cst_vps_key \
            > /dev/null

          printf "%s\n" "${CST_VPS_KNOWN_HOSTS}" \
            > ~/.ssh/known_hosts

          sed -i 's/\r$//' ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host cst-vps
            HostName ${CST_VPS_HOST}
            User ${CST_VPS_USER}
            Port ${CST_VPS_PORT}
            IdentityFile ~/.ssh/cst_vps_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

          chmod 600 ~/.ssh/config

          ssh cst-vps 'echo "SSH CST OK"'

      # ============================================================
      # 4. SYNCHRONISATION GIT
      # ============================================================
      - name: Sync production source
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps "EXPECTED_SHA='${GITHUB_SHA}' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/home/eccops/apps/cst-website"
          DOCKER_DIR="${APP_DIR}/docker"

          cd "${APP_DIR}"

          echo "===== VERSION ACTUELLE ====="
          git rev-parse --short HEAD || true

          echo
          echo "===== SYNCHRONISATION ====="

          git fetch \
            --prune \
            origin \
            feature-v2

          git clean \
            -fd \
            -e docker/.env.prod

          git reset \
            --hard \
            origin/feature-v2

          DEPLOY_SHA="$(git rev-parse HEAD)"

          echo "Version récupérée : ${DEPLOY_SHA}"

          if [ "${DEPLOY_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "ERREUR : le VPS n'est pas sur le commit attendu."
            echo "Attendu : ${EXPECTED_SHA}"
            echo "VPS     : ${DEPLOY_SHA}"
            exit 1
          fi

          test -s "${DOCKER_DIR}/.env.prod"

          cd "${DOCKER_DIR}"

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            config \
            > /dev/null

          echo "✅ Sources synchronisées"
          REMOTE

      # ============================================================
      # 5. INFRASTRUCTURE
      # ============================================================
      - name: Ensure PostgreSQL and Redis
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          compose() {
            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              "$@"
          }

          wait_health() {
            container="$1"
            timeout="$2"
            elapsed=0

            while [ "${elapsed}" -lt "${timeout}" ]; do
              health="$(
                docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "${container}" \
                  2>/dev/null || true
              )"

              if [ "${health}" = "healthy" ] || \
                 [ "${health}" = "running" ]; then
                echo "✅ ${container}: ${health}"
                return 0
              fi

              sleep 3
              elapsed=$((elapsed + 3))
            done

            echo "❌ ${container} indisponible"
            docker logs --tail=100 "${container}" || true
            exit 1
          }

          compose up -d cst_db cst_redis

          wait_health cst-db 120
          wait_health cst-redis 90
          REMOTE

      # ============================================================
      # 6. BACKUP DB
      # Seulement lorsqu'il y a une modification backend.
      # ============================================================
      - name: Backup PostgreSQL
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/home/eccops/apps/cst-website"
          BACKUP_DIR="/home/eccops/backups/cst"

          DEPLOY_SHA="$(
            git -C "${APP_DIR}" rev-parse --short HEAD
          )"

          mkdir -p "${BACKUP_DIR}"
          chmod 700 "${BACKUP_DIR}"

          BACKUP_FILE="${BACKUP_DIR}/cst_$(date '+%Y%m%d_%H%M%S')_${DEPLOY_SHA}.sql.gz"

          echo "Backup : ${BACKUP_FILE}"

          docker exec cst-db sh -c \
            'pg_dump \
              --clean \
              --if-exists \
              --no-owner \
              --no-privileges \
              -U "$POSTGRES_USER" \
              "$POSTGRES_DB"' \
            | gzip -9 \
            > "${BACKUP_FILE}"

          test -s "${BACKUP_FILE}"

          find "${BACKUP_DIR}" \
            -type f \
            -name 'cst_*.sql.gz' \
            -mtime +14 \
            -delete || true

          echo "✅ Backup terminé"
          REMOTE

      # ============================================================
      # 7. BUILD BACKEND
      # ============================================================
      - name: Build backend
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            build \
            cst_backend

          echo "✅ Backend build terminé"
          REMOTE

      # ============================================================
      # 8. DJANGO / MIGRATIONS
      # ============================================================
      - name: Django checks and migrations
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          django() {
            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              run \
              --rm \
              --no-deps \
              cst_backend \
              python manage.py "$@"
          }

          echo "===== DJANGO CHECK ====="
          django check

          echo
          echo "===== MIGRATIONS MANQUANTES ? ====="
          django makemigrations \
            --check \
            --dry-run

          echo
          echo "===== PLAN MIGRATIONS ====="
          django migrate --plan

          echo
          echo "===== APPLICATION MIGRATIONS ====="
          django migrate --noinput

          echo
          echo "===== VALIDATION MIGRATIONS ====="
          django migrate --check

          echo
          echo "===== COLLECTSTATIC ====="
          django collectstatic --noinput

          echo
          echo "===== DATABASE TEST ====="
          django shell -c \
            "from django.db import connection; connection.ensure_connection(); print('DATABASE OK')"

          echo "✅ Django prêt"
          REMOTE

      # ============================================================
      # 9. DEPLOY BACKEND
      # ============================================================
      - name: Deploy backend
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          compose() {
            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              "$@"
          }

          OLD_ID="$(
            docker inspect \
              --format='{{.Id}}' \
              cst-backend \
              2>/dev/null || true
          )"

          compose up -d \
            --force-recreate \
            --no-deps \
            cst_backend

          NEW_ID="$(
            docker inspect \
              --format='{{.Id}}' \
              cst-backend
          )"

          if [ -n "${OLD_ID}" ] && \
             [ "${OLD_ID}" = "${NEW_ID}" ]; then
            echo "❌ Backend non recréé"
            exit 1
          fi

          echo "Nouveau container backend : ${NEW_ID:0:12}"

          for i in $(seq 1 40); do
            if docker exec cst-backend \
              python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5).read()" \
              >/dev/null 2>&1; then

              echo "✅ Backend opérationnel"
              exit 0
            fi

            sleep 3
          done

          echo "❌ Backend non disponible"
          docker logs --tail=150 cst-backend || true
          exit 1
          REMOTE

      # ============================================================
      # 10. CELERY
      # ============================================================
      - name: Deploy Celery worker
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up -d \
            --force-recreate \
            --no-deps \
            cst_celery_worker

          sleep 5

          STATUS="$(
            docker inspect \
              --format='{{.State.Status}}' \
              cst-celery-worker \
              2>/dev/null || true
          )"

          if [ "${STATUS}" != "running" ]; then
            echo "❌ Celery : ${STATUS}"
            docker logs --tail=120 cst-celery-worker || true
            exit 1
          fi

          echo "✅ Celery worker opérationnel"
          REMOTE

      # ============================================================
      # 11. BUILD FRONTEND
      # ============================================================
      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          echo "===== BUILD FRONTEND ====="

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            build \
            cst_frontend

          echo "✅ Frontend build terminé"
          REMOTE

      # ============================================================
      # 12. DEPLOY FRONTEND
      # ============================================================
      - name: Deploy frontend
        if: steps.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          OLD_ID="$(
            docker inspect \
              --format='{{.Id}}' \
              cst-frontend \
              2>/dev/null || true
          )"

          echo "Ancien container : ${OLD_ID:-aucun}"

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up -d \
            --force-recreate \
            --no-deps \
            cst_frontend

          NEW_ID="$(
            docker inspect \
              --format='{{.Id}}' \
              cst-frontend
          )"

          echo "Nouveau container : ${NEW_ID}"

          if [ -n "${OLD_ID}" ] && \
             [ "${OLD_ID}" = "${NEW_ID}" ]; then
            echo "❌ Le frontend n'a pas été recréé."
            exit 1
          fi

          for i in $(seq 1 60); do
            HEALTH="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                cst-frontend \
                2>/dev/null || true
            )"

            if [ "${HEALTH}" = "healthy" ]; then
              echo "✅ Frontend healthy"
              break
            fi

            if [ "${HEALTH}" = "unhealthy" ] || \
               [ "${HEALTH}" = "exited" ]; then
              echo "❌ Frontend : ${HEALTH}"
              docker logs --tail=150 cst-frontend || true
              exit 1
            fi

            sleep 3
          done

          FINAL_HEALTH="$(
            docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              cst-frontend
          )"

          if [ "${FINAL_HEALTH}" != "healthy" ]; then
            echo "❌ Frontend non healthy : ${FINAL_HEALTH}"
            exit 1
          fi

          echo
          echo "===== NEXT BUILD ====="

          docker exec cst-frontend sh -lc '
            echo "BUILD_ID:"
            cat /app/.next/BUILD_ID 2>/dev/null || true

            echo
            echo "BUILD_DATE:"
            stat /app/.next/BUILD_ID 2>/dev/null || true
          '

          echo "✅ Nouveau frontend effectivement déployé"
          REMOTE

      # ============================================================
      # 13. BUILD GATEWAY
      # Seulement si sa configuration / Docker a changé.
      # ============================================================
      - name: Build gateway
        if: steps.changes.outputs.gateway == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            build \
            cst_gateway

          echo "✅ Gateway build terminé"
          REMOTE

      # ============================================================
      # 14. RECREATE GATEWAY
      #
      # Important :
      # lorsqu'un frontend/backend est recréé, son IP Docker peut
      # changer. On recrée donc Nginx afin qu'il résolve de nouveau
      # les noms cst-frontend / cst-backend.
      # ============================================================
      - name: Reload application gateway
        if: |
          steps.changes.outputs.backend == 'true' ||
          steps.changes.outputs.frontend == 'true' ||
          steps.changes.outputs.gateway == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up -d \
            --force-recreate \
            --no-deps \
            cst_gateway

          for i in $(seq 1 40); do
            HEALTH="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                cst-gateway \
                2>/dev/null || true
            )"

            if [ "${HEALTH}" = "healthy" ]; then
              echo "✅ Gateway healthy"
              break
            fi

            sleep 3
          done

          HEALTH="$(
            docker inspect \
              --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              cst-gateway
          )"

          if [ "${HEALTH}" != "healthy" ]; then
            echo "❌ Gateway non healthy"
            docker logs --tail=150 cst-gateway || true
            exit 1
          fi

          # L'ecc-shield doit également résoudre le nouveau gateway.
          docker exec ecc-shield nginx -t
          docker exec ecc-shield nginx -s reload

          echo "✅ Gateway rechargé"
          REMOTE

      # ============================================================
      # 15. VALIDATION FINALE
      # ============================================================
      - name: Production health checks
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          PUBLIC_URL="https://cst.ecc.bj"

          assert_running() {
            container="$1"

            STATUS="$(
              docker inspect \
                --format='{{.State.Status}}' \
                "${container}" \
                2>/dev/null || true
            )"

            if [ "${STATUS}" != "running" ]; then
              echo "❌ ${container}: ${STATUS:-absent}"
              docker logs --tail=100 "${container}" 2>/dev/null || true
              exit 1
            fi

            HAS_HEALTH="$(
              docker inspect \
                --format='{{if .State.Health}}yes{{else}}no{{end}}' \
                "${container}" \
                2>/dev/null || true
            )"

            if [ "${HAS_HEALTH}" = "yes" ]; then
              HEALTH="$(
                docker inspect \
                  --format='{{.State.Health.Status}}' \
                  "${container}"
              )"

              if [ "${HEALTH}" != "healthy" ]; then
                echo "❌ ${container}: ${HEALTH}"
                exit 1
              fi

              echo "✅ ${container}: healthy"
            else
              echo "✅ ${container}: running"
            fi
          }

          echo "===== SERVICES ====="

          assert_running cst-db
          assert_running cst-redis
          assert_running cst-backend
          assert_running cst-frontend
          assert_running cst-celery-worker
          assert_running cst-gateway

          echo
          echo "===== INTERNAL API ====="

          docker exec cst-gateway \
            wget \
            --timeout=10 \
            --tries=2 \
            -q \
            -O /dev/null \
            http://cst-backend:8000/api/v1/health/

          docker exec cst-gateway \
            wget \
            --timeout=10 \
            --tries=2 \
            -q \
            -O /dev/null \
            http://127.0.0.1:8080/gateway-health

          echo "✅ Communication interne OK"

          echo
          echo "===== PUBLIC HTTPS ====="

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            -o /dev/null \
            "${PUBLIC_URL}/"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --connect-timeout 10 \
            --max-time 30 \
            "${PUBLIC_URL}/api/v1/health/" \
            >/dev/null

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 30 \
            "${PUBLIC_URL}/api/v1/news/" \
            >/dev/null

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 30 \
            "${PUBLIC_URL}/api/v1/news/home-special/" \
            >/dev/null

          echo "✅ HTTPS public OK"

          echo
          echo "===== ETAT FINAL ====="

          cd /home/eccops/apps/cst-website/docker

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            ps

          echo
          echo "Commit déployé :"
          git -C /home/eccops/apps/cst-website \
            rev-parse HEAD

          echo
          echo "✅ CST PRODUCTION OPÉRATIONNEL"
          REMOTE

      # ============================================================
      # 16. DIAGNOSTIC EN CAS D'ERREUR
      # ============================================================
      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          ssh cst-vps 'bash -se' <<'REMOTE' || true

          echo "===== DOCKER PS ====="

          cd /home/eccops/apps/cst-website/docker || exit 0

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            ps -a || true

          echo
          echo "===== BACKEND ====="
          docker logs --tail=120 cst-backend || true

          echo
          echo "===== FRONTEND ====="
          docker logs --tail=120 cst-frontend || true

          echo
          echo "===== CELERY ====="
          docker logs --tail=100 cst-celery-worker || true

          echo
          echo "===== GATEWAY ====="
          docker logs --tail=120 cst-gateway || true

          REMOTE

