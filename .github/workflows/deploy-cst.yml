name: Deploy CST Production

on:
  push:
    branches:
      - feature-v2

  workflow_dispatch:

concurrency:
  group: cst-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy CST Production
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PREPARATION SSH
      #
      # Doit être exécuté avant la détection des composants car nous
      # récupérons sur le VPS le SHA du dernier déploiement réussi.
      # ============================================================
      - name: Prepare SSH
        shell: bash
        env:
          CST_VPS_SSH_KEY: ${{ secrets.CST_VPS_SSH_KEY }}
          CST_VPS_KNOWN_HOSTS: ${{ secrets.CST_VPS_KNOWN_HOSTS }}
          CST_VPS_HOST: ${{ secrets.CST_VPS_HOST }}
          CST_VPS_PORT: ${{ secrets.CST_VPS_PORT }}
          CST_VPS_USER: ${{ secrets.CST_VPS_USER }}
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          test -n "${CST_VPS_SSH_KEY}"
          test -n "${CST_VPS_KNOWN_HOSTS}"
          test -n "${CST_VPS_HOST}"
          test -n "${CST_VPS_PORT}"
          test -n "${CST_VPS_USER}"

          printf "%s\n" "${CST_VPS_SSH_KEY}" > ~/.ssh/cst_vps_key
          sed -i 's/\r$//' ~/.ssh/cst_vps_key
          chmod 600 ~/.ssh/cst_vps_key

          # Validation de la clé privée.
          ssh-keygen -y \
            -f ~/.ssh/cst_vps_key \
            > /dev/null

          printf "%s\n" "${CST_VPS_KNOWN_HOSTS}" \
            > ~/.ssh/known_hosts

          sed -i 's/\r$//' ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host cst-vps
            HostName ${CST_VPS_HOST}
            User ${CST_VPS_USER}
            Port ${CST_VPS_PORT}
            IdentityFile ~/.ssh/cst_vps_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

          chmod 600 ~/.ssh/config

          ssh cst-vps 'echo "✅ SSH CST OK"'

      # ============================================================
      # 3. DETECTION DES COMPOSANTS A DEPLOYER
      #
      # IMPORTANT :
      # on ne compare PAS seulement avec github.event.before.
      #
      # On compare avec le dernier commit dont le déploiement
      # production a été entièrement validé.
      #
      # Cela permet de reprendre correctement un déploiement qui
      # aurait échoué après la synchronisation Git mais avant les
      # migrations ou avant les healthchecks.
      # ============================================================
      - name: Detect changed components
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail

          BACKEND=false
          FRONTEND=false
          GATEWAY=false

          STATE_FILE="/home/eccops/deploy-state/cst/last-successful-sha"

          LAST_SUCCESS_SHA="$(
            ssh cst-vps \
              "cat '${STATE_FILE}' 2>/dev/null || true"
          )"

          echo "Dernier déploiement réussi : ${LAST_SUCCESS_SHA:-aucun}"
          echo "Commit demandé             : ${GITHUB_SHA}"

          # --------------------------------------------------------
          # Déploiement manuel :
          # reconstruction complète de sécurité.
          # --------------------------------------------------------
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then

            echo
            echo "Déploiement manuel : déploiement complet."

            BACKEND=true
            FRONTEND=true
            GATEWAY=true

          # --------------------------------------------------------
          # Aucun état précédent :
          # premier lancement avec cette nouvelle stratégie.
          # --------------------------------------------------------
          elif [ -z "${LAST_SUCCESS_SHA}" ]; then

            echo
            echo "Aucun dernier déploiement réussi enregistré."
            echo "Déploiement complet de sécurité."

            BACKEND=true
            FRONTEND=true
            GATEWAY=true

          # --------------------------------------------------------
          # Le SHA enregistré n'existe plus dans Git.
          # Peut arriver après un rebase / force push.
          # --------------------------------------------------------
          elif ! git cat-file \
            -e "${LAST_SUCCESS_SHA}^{commit}" \
            2>/dev/null; then

            echo
            echo "Le commit enregistré n'existe plus dans l'historique."
            echo "Déploiement complet de sécurité."

            BACKEND=true
            FRONTEND=true
            GATEWAY=true

          # --------------------------------------------------------
          # Historique divergent :
          # on ne prend aucun risque.
          # --------------------------------------------------------
          elif ! git merge-base \
            --is-ancestor \
            "${LAST_SUCCESS_SHA}" \
            "${GITHUB_SHA}" \
            2>/dev/null; then

            echo
            echo "L'historique Git a divergé."
            echo "Déploiement complet de sécurité."

            BACKEND=true
            FRONTEND=true
            GATEWAY=true

          # --------------------------------------------------------
          # Commit déjà complètement déployé.
          # --------------------------------------------------------
          elif [ "${LAST_SUCCESS_SHA}" = "${GITHUB_SHA}" ]; then

            echo
            echo "Le commit demandé correspond déjà au dernier"
            echo "déploiement production réussi."

          # --------------------------------------------------------
          # Comparaison depuis la vraie production.
          # --------------------------------------------------------
          else

            CHANGED_FILES="$(
              git diff \
                --name-only \
                "${LAST_SUCCESS_SHA}" \
                "${GITHUB_SHA}"
            )"

            echo
            echo "===== FICHIERS MODIFIÉS DEPUIS LA PROD ====="
            echo "${CHANGED_FILES}"
            echo "============================================="

            while IFS= read -r FILE; do

              [ -z "${FILE}" ] && continue

              case "${FILE}" in

                backend/*)
                  BACKEND=true
                  ;;

                frontend/*)
                  FRONTEND=true
                  ;;

                docker/nginx/*)
                  GATEWAY=true
                  ;;

                gateway/*)
                  GATEWAY=true
                  ;;

                nginx/*)
                  GATEWAY=true
                  ;;

                docker/docker-compose.prod.yml)
                  BACKEND=true
                  FRONTEND=true
                  GATEWAY=true
                  ;;

                docker/*)
                  # Toute autre modification de l'infrastructure
                  # Docker est considérée comme transversale.
                  BACKEND=true
                  FRONTEND=true
                  GATEWAY=true
                  ;;

                .dockerignore)
                  BACKEND=true
                  FRONTEND=true
                  GATEWAY=true
                  ;;

              esac

            done <<< "${CHANGED_FILES}"
          fi

          echo "backend=${BACKEND}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${FRONTEND}" >> "${GITHUB_OUTPUT}"
          echo "gateway=${GATEWAY}" >> "${GITHUB_OUTPUT}"
          echo "last_success_sha=${LAST_SUCCESS_SHA}" >> "${GITHUB_OUTPUT}"

          echo
          echo "===== PLAN DE DÉPLOIEMENT ====="
          echo "Backend  : ${BACKEND}"
          echo "Frontend : ${FRONTEND}"
          echo "Gateway  : ${GATEWAY}"
          echo "================================"

          {
            echo "## Plan de déploiement CST"
            echo
            echo "| Composant | Déploiement |"
            echo "|---|---|"
            echo "| Backend | ${BACKEND} |"
            echo "| Frontend | ${FRONTEND} |"
            echo "| Gateway | ${GATEWAY} |"
            echo
            echo "Dernier succès : \`${LAST_SUCCESS_SHA:-aucun}\`"
            echo
            echo "Commit demandé : \`${GITHUB_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ============================================================
      # 4. SYNCHRONISATION GIT
      # ============================================================
      - name: Sync production source
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps "EXPECTED_SHA='${GITHUB_SHA}' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/home/eccops/apps/cst-website"
          DOCKER_DIR="${APP_DIR}/docker"

          cd "${APP_DIR}"

          echo "===== VERSION ACTUELLE ====="
          git rev-parse --short HEAD || true

          echo
          echo "===== SYNCHRONISATION ====="

          git fetch \
            --prune \
            origin \
            feature-v2

          # Nettoyage des fichiers non suivis,
          # en conservant impérativement le .env production.
          git clean \
            -fd \
            -e docker/.env.prod

          git reset \
            --hard \
            origin/feature-v2

          DEPLOY_SHA="$(
            git rev-parse HEAD
          )"

          echo "Version récupérée : ${DEPLOY_SHA}"

          if [ "${DEPLOY_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "❌ Le VPS n'est pas sur le commit attendu."
            echo "Attendu : ${EXPECTED_SHA}"
            echo "VPS     : ${DEPLOY_SHA}"
            exit 1
          fi

          test -s "${DOCKER_DIR}/.env.prod"

          cd "${DOCKER_DIR}"

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            config \
            > /dev/null

          echo "✅ Sources synchronisées"
          REMOTE

      # ============================================================
      # 5. INFRASTRUCTURE
      # PostgreSQL et Redis doivent être disponibles avant toute
      # opération Django.
      # ============================================================
      - name: Ensure PostgreSQL and Redis
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          compose() {
            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              "$@"
          }

          wait_health() {
            container="$1"
            timeout="$2"
            elapsed=0

            while [ "${elapsed}" -lt "${timeout}" ]; do

              health="$(
                docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                  "${container}" \
                  2>/dev/null || true
              )"

              if [ "${health}" = "healthy" ] || \
                 [ "${health}" = "running" ]; then

                echo "✅ ${container}: ${health}"
                return 0
              fi

              sleep 3
              elapsed=$((elapsed + 3))
            done

            echo "❌ ${container} indisponible"

            docker logs \
              --tail=100 \
              "${container}" \
              || true

            exit 1
          }

          compose up -d cst_db cst_redis

          wait_health cst-db 120
          wait_health cst-redis 90
          REMOTE

      # ============================================================
      # 6. BACKUP POSTGRESQL
      #
      # Le backup est requis lorsqu'un changement backend est détecté.
      # Grâce au SHA du dernier déploiement réussi, un backend dont le
      # précédent déploiement a échoué sera de nouveau détecté ici.
      # ============================================================
      - name: Backup PostgreSQL
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/home/eccops/apps/cst-website"
          BACKUP_DIR="/home/eccops/backups/cst"

          DEPLOY_SHA="$(
            git -C "${APP_DIR}" \
              rev-parse --short HEAD
          )"

          mkdir -p "${BACKUP_DIR}"
          chmod 700 "${BACKUP_DIR}"

          BACKUP_FILE="${BACKUP_DIR}/cst_$(date '+%Y%m%d_%H%M%S')_${DEPLOY_SHA}.sql.gz"

          echo "Backup : ${BACKUP_FILE}"

          docker exec cst-db sh -c \
            'pg_dump \
              --clean \
              --if-exists \
              --no-owner \
              --no-privileges \
              -U "$POSTGRES_USER" \
              "$POSTGRES_DB"' \
            | gzip -9 \
            > "${BACKUP_FILE}"

          test -s "${BACKUP_FILE}"

          find "${BACKUP_DIR}" \
            -type f \
            -name 'cst_*.sql.gz' \
            -mtime +14 \
            -delete \
            || true

          echo "✅ Backup PostgreSQL terminé"
          REMOTE

      # ============================================================
      # 7. BUILD BACKEND
      #
      # Si le backend a changé, la nouvelle image doit être construite
      # AVANT l'exécution des migrations.
      # ============================================================
      - name: Build backend
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          echo "===== BUILD BACKEND ====="

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            build \
            cst_backend

          echo "✅ Backend build terminé"
          REMOTE

      # ============================================================
      # 8. DJANGO / MIGRATIONS
      #
      # IMPORTANT :
      # cette étape est TOUJOURS exécutée.
      #
      # Même si le dernier commit ne concerne que le frontend,
      # Django vérifie systématiquement l'état de la base.
      #
      # migrate est idempotent :
      # s'il n'y a aucune migration, Django ne modifie rien.
      # ============================================================
      - name: Django checks and migrations
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          django() {
            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              run \
              --rm \
              --no-deps \
              cst_backend \
              python manage.py "$@"
          }

          echo "===== DJANGO CHECK ====="

          django check

          echo
          echo "===== MIGRATIONS MANQUANTES DANS LE CODE ? ====="

          # Échoue si les modèles Django ont été modifiés
          # sans fichier de migration correspondant.
          django makemigrations \
            --check \
            --dry-run

          echo
          echo "===== PLAN DES MIGRATIONS ====="

          django migrate --plan

          echo
          echo "===== APPLICATION DES MIGRATIONS ====="

          django migrate --noinput

          echo
          echo "===== VALIDATION DES MIGRATIONS ====="

          django migrate --check

          echo
          echo "===== COLLECTSTATIC ====="

          django collectstatic --noinput

          echo
          echo "===== TEST DATABASE ====="

          django shell -c \
            "from django.db import connection; connection.ensure_connection(); print('DATABASE OK')"

          echo
          echo "✅ Django et base de données synchronisés"
          REMOTE

      # ============================================================
      # 9. DEPLOY BACKEND
      # ============================================================
      - name: Deploy backend
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          compose() {
            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              "$@"
          }

          OLD_ID="$(
            docker inspect \
              --format='{{.Id}}' \
              cst-backend \
              2>/dev/null || true
          )"

          echo "Ancien backend : ${OLD_ID:-aucun}"

          compose up \
            -d \
            --force-recreate \
            --no-deps \
            cst_backend

          NEW_ID="$(
            docker inspect \
              --format='{{.Id}}' \
              cst-backend
          )"

          echo "Nouveau backend : ${NEW_ID}"

          if [ -n "${OLD_ID}" ] && \
             [ "${OLD_ID}" = "${NEW_ID}" ]; then

            echo "❌ Backend non recréé"
            exit 1
          fi

          echo
          echo "===== ATTENTE BACKEND ====="

          READY=false

          for i in $(seq 1 40); do

            if docker exec cst-backend \
              python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5).read()" \
              >/dev/null 2>&1; then

              READY=true
              echo "✅ Backend opérationnel"
              break
            fi

            echo "Backend non prêt (${i}/40)"
            sleep 3
          done

          if [ "${READY}" != "true" ]; then
            echo "❌ Backend non disponible"

            docker logs \
              --tail=150 \
              cst-backend \
              || true

            exit 1
          fi
          REMOTE

      # ============================================================
      # 10. CELERY
      # ============================================================
      - name: Deploy Celery worker
        if: steps.changes.outputs.backend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up \
            -d \
            --force-recreate \
            --no-deps \
            cst_celery_worker

          sleep 5

          STATUS="$(
            docker inspect \
              --format='{{.State.Status}}' \
              cst-celery-worker \
              2>/dev/null || true
          )"

          if [ "${STATUS}" != "running" ]; then

            echo "❌ Celery : ${STATUS}"

            docker logs \
              --tail=120 \
              cst-celery-worker \
              || true

            exit 1
          fi

          echo "✅ Celery worker opérationnel"
          REMOTE

      # ============================================================
      # 11. BUILD FRONTEND
      # ============================================================
      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          echo "===== BUILD FRONTEND ====="

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            build \
            cst_frontend

          echo "✅ Frontend build terminé"
          REMOTE

      # ============================================================
      # 12. DEPLOY FRONTEND
      # ============================================================
      - name: Deploy frontend
        if: steps.changes.outputs.frontend == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          OLD_ID="$(
            docker inspect \
              --format='{{.Id}}' \
              cst-frontend \
              2>/dev/null || true
          )"

          echo "Ancien frontend : ${OLD_ID:-aucun}"

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up \
            -d \
            --force-recreate \
            --no-deps \
            cst_frontend

          NEW_ID="$(
            docker inspect \
              --format='{{.Id}}' \
              cst-frontend
          )"

          echo "Nouveau frontend : ${NEW_ID}"

          if [ -n "${OLD_ID}" ] && \
             [ "${OLD_ID}" = "${NEW_ID}" ]; then

            echo "❌ Le frontend n'a pas été recréé."
            exit 1
          fi

          READY=false

          for i in $(seq 1 60); do

            HEALTH="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                cst-frontend \
                2>/dev/null || true
            )"

            echo "Frontend ${i}/60 : ${HEALTH:-inconnu}"

            if [ "${HEALTH}" = "healthy" ]; then
              READY=true
              break
            fi

            if [ "${HEALTH}" = "unhealthy" ] || \
               [ "${HEALTH}" = "exited" ]; then

              echo "❌ Frontend : ${HEALTH}"

              docker logs \
                --tail=150 \
                cst-frontend \
                || true

              exit 1
            fi

            sleep 3
          done

          if [ "${READY}" != "true" ]; then

            echo "❌ Frontend non healthy"

            docker logs \
              --tail=150 \
              cst-frontend \
              || true

            exit 1
          fi

          echo
          echo "===== NEXT BUILD ====="

          docker exec cst-frontend sh -lc '
            echo "BUILD_ID:"
            cat /app/.next/BUILD_ID 2>/dev/null || true

            echo
            echo "BUILD_DATE:"
            stat /app/.next/BUILD_ID 2>/dev/null || true
          '

          echo
          echo "✅ Nouveau frontend effectivement déployé"
          REMOTE

      # ============================================================
      # 13. BUILD GATEWAY
      # ============================================================
      - name: Build gateway
        if: steps.changes.outputs.gateway == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          echo "===== BUILD GATEWAY ====="

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            build \
            cst_gateway

          echo "✅ Gateway build terminé"
          REMOTE

      # ============================================================
      # 14. RECREATE / RELOAD APPLICATION GATEWAY
      #
      # Après recréation d'un frontend/backend, son IP Docker peut
      # changer.
      #
      # Le gateway est donc recréé afin de résoudre à nouveau les
      # noms Docker.
      # ============================================================
      - name: Reload application gateway
        if: |
          steps.changes.outputs.backend == 'true' ||
          steps.changes.outputs.frontend == 'true' ||
          steps.changes.outputs.gateway == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /home/eccops/apps/cst-website/docker

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            up \
            -d \
            --force-recreate \
            --no-deps \
            cst_gateway

          READY=false

          for i in $(seq 1 40); do

            HEALTH="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                cst-gateway \
                2>/dev/null || true
            )"

            echo "Gateway ${i}/40 : ${HEALTH:-inconnu}"

            if [ "${HEALTH}" = "healthy" ]; then
              READY=true
              break
            fi

            if [ "${HEALTH}" = "unhealthy" ] || \
               [ "${HEALTH}" = "exited" ]; then
              break
            fi

            sleep 3
          done

          if [ "${READY}" != "true" ]; then

            echo "❌ Gateway non healthy"

            docker logs \
              --tail=150 \
              cst-gateway \
              || true

            exit 1
          fi

          echo
          echo "===== RELOAD ECC-SHIELD ====="

          docker exec ecc-shield nginx -t
          docker exec ecc-shield nginx -s reload

          echo "✅ Gateway et ecc-shield rechargés"
          REMOTE

      # ============================================================
      # 15. VALIDATION FINALE
      #
      # Cette étape teste :
      # - conteneurs
      # - migrations
      # - backend direct
      # - frontend via gateway
      # - API via gateway
      # - endpoints métiers
      # - HTTPS public
      # ============================================================
      - name: Production health checks
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          PUBLIC_URL="https://cst.ecc.bj"

          # --------------------------------------------------------
          # Validation des conteneurs
          # --------------------------------------------------------
          assert_running() {

            container="$1"

            STATUS="$(
              docker inspect \
                --format='{{.State.Status}}' \
                "${container}" \
                2>/dev/null || true
            )"

            if [ "${STATUS}" != "running" ]; then

              echo "❌ ${container}: ${STATUS:-absent}"

              docker logs \
                --tail=100 \
                "${container}" \
                2>/dev/null \
                || true

              exit 1
            fi

            HAS_HEALTH="$(
              docker inspect \
                --format='{{if .State.Health}}yes{{else}}no{{end}}' \
                "${container}" \
                2>/dev/null || true
            )"

            if [ "${HAS_HEALTH}" = "yes" ]; then

              HEALTH="$(
                docker inspect \
                  --format='{{.State.Health.Status}}' \
                  "${container}"
              )"

              if [ "${HEALTH}" != "healthy" ]; then
                echo "❌ ${container}: ${HEALTH}"
                exit 1
              fi

              echo "✅ ${container}: healthy"

            else

              echo "✅ ${container}: running"

            fi
          }

          # --------------------------------------------------------
          # Contrôle HTTP public avec diagnostic lisible.
          # Plusieurs essais sont autorisés afin de laisser le proxy
          # terminer sa stabilisation après une recréation.
          # --------------------------------------------------------
          public_check() {

            NAME="$1"
            URL="$2"
            ATTEMPTS="${3:-6}"

            BODY_FILE="$(mktemp)"
            HEADER_FILE="$(mktemp)"
            ERROR_FILE="$(mktemp)"

            SUCCESS=false
            STATUS="000"

            for i in $(seq 1 "${ATTEMPTS}"); do

              : > "${BODY_FILE}"
              : > "${HEADER_FILE}"
              : > "${ERROR_FILE}"

              STATUS="$(
                curl \
                  --silent \
                  --show-error \
                  --location \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --dump-header "${HEADER_FILE}" \
                  --output "${BODY_FILE}" \
                  --write-out '%{http_code}' \
                  "${URL}" \
                  2>"${ERROR_FILE}" \
                  || true
              )"

              echo "${NAME} (${i}/${ATTEMPTS}) : HTTP ${STATUS:-000}"

              case "${STATUS}" in
                2??)
                  SUCCESS=true
                  break
                  ;;
              esac

              sleep 3
            done

            if [ "${SUCCESS}" != "true" ]; then

              echo
              echo "❌ ${NAME}"
              echo "URL : ${URL}"
              echo "HTTP : ${STATUS:-000}"

              echo
              echo "===== CURL ERROR ====="
              cat "${ERROR_FILE}" || true

              echo
              echo "===== RESPONSE HEADERS ====="
              cat "${HEADER_FILE}" || true

              echo
              echo "===== RESPONSE BODY ====="
              head -c 3000 "${BODY_FILE}" || true
              echo

              rm -f \
                "${BODY_FILE}" \
                "${HEADER_FILE}" \
                "${ERROR_FILE}"

              return 1
            fi

            rm -f \
              "${BODY_FILE}" \
              "${HEADER_FILE}" \
              "${ERROR_FILE}"

            echo "✅ ${NAME}"
          }

          echo "===== SERVICES ====="

          assert_running cst-db
          assert_running cst-redis
          assert_running cst-backend
          assert_running cst-frontend
          assert_running cst-celery-worker
          assert_running cst-gateway

          # --------------------------------------------------------
          # GARDE FINALE MIGRATIONS
          # --------------------------------------------------------
          echo
          echo "===== DATABASE MIGRATION STATE ====="

          docker exec cst-backend \
            python manage.py migrate --check

          echo "✅ Aucune migration Django en attente"

          # --------------------------------------------------------
          # BACKEND DIRECT
          # --------------------------------------------------------
          echo
          echo "===== BACKEND DIRECT ====="

          docker exec cst-gateway \
            wget \
            --timeout=10 \
            --tries=2 \
            -q \
            -O /dev/null \
            http://cst-backend:8000/api/v1/health/

          echo "✅ Backend direct OK"

          # --------------------------------------------------------
          # FRONTEND DIRECT
          # --------------------------------------------------------
          echo
          echo "===== FRONTEND DIRECT ====="

          docker exec cst-gateway \
            wget \
            --timeout=10 \
            --tries=2 \
            --header="Host: cst.ecc.bj" \
            -q \
            -O /dev/null \
            http://cst-frontend:3000/

          echo "✅ Frontend direct OK"

          # --------------------------------------------------------
          # CST GATEWAY
          # --------------------------------------------------------
          echo
          echo "===== CST GATEWAY ====="

          docker exec cst-gateway \
            wget \
            --timeout=10 \
            --tries=2 \
            -q \
            -O /dev/null \
            http://127.0.0.1:8080/gateway-health

          echo "✅ Gateway health OK"

          docker exec cst-gateway \
            wget \
            --timeout=10 \
            --tries=2 \
            --header="Host: cst.ecc.bj" \
            -q \
            -O /dev/null \
            http://127.0.0.1:8080/

          echo "✅ Gateway → Frontend OK"

          docker exec cst-gateway \
            wget \
            --timeout=10 \
            --tries=2 \
            --header="Host: cst.ecc.bj" \
            -q \
            -O /dev/null \
            http://127.0.0.1:8080/api/v1/health/

          echo "✅ Gateway → API health OK"

          # --------------------------------------------------------
          # ENDPOINTS METIERS CRITIQUES
          #
          # Ces contrôles empêchent notamment qu'un problème de
          # migration News passe inaperçu.
          # --------------------------------------------------------
          echo
          echo "===== INTERNAL BUSINESS API ====="

          docker exec cst-gateway \
            wget \
            --timeout=15 \
            --tries=2 \
            --header="Host: cst.ecc.bj" \
            -q \
            -O /dev/null \
            http://127.0.0.1:8080/api/v1/news/

          echo "✅ API News interne OK"

          docker exec cst-gateway \
            wget \
            --timeout=15 \
            --tries=2 \
            --header="Host: cst.ecc.bj" \
            -q \
            -O /dev/null \
            http://127.0.0.1:8080/api/v1/news/home-special/

          echo "✅ API Home Special interne OK"

          # --------------------------------------------------------
          # HTTPS PUBLIC
          # --------------------------------------------------------
          echo
          echo "===== PUBLIC HTTPS ====="

          public_check \
            "Homepage" \
            "${PUBLIC_URL}/"

          public_check \
            "API health" \
            "${PUBLIC_URL}/api/v1/health/"

          public_check \
            "API News" \
            "${PUBLIC_URL}/api/v1/news/"

          public_check \
            "API Home Special" \
            "${PUBLIC_URL}/api/v1/news/home-special/"

          echo
          echo "✅ HTTPS public OK"

          # --------------------------------------------------------
          # ETAT FINAL
          # --------------------------------------------------------
          echo
          echo "===== ETAT FINAL ====="

          cd /home/eccops/apps/cst-website/docker

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            ps

          echo
          echo "Commit déployé :"

          git \
            -C /home/eccops/apps/cst-website \
            rev-parse HEAD

          echo
          echo "✅ CST PRODUCTION OPÉRATIONNEL"
          REMOTE

      # ============================================================
      # 16. ENREGISTREMENT DU DERNIER DEPLOIEMENT REUSSI
      #
      # IMPORTANT :
      # cette étape arrive uniquement APRES :
      # - migrations
      # - déploiement
      # - tests internes
      # - tests HTTPS publics
      #
      # Si quoi que ce soit échoue avant, le SHA précédent reste
      # enregistré.
      # ============================================================
      - name: Mark deployment successful
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh cst-vps "EXPECTED_SHA='${GITHUB_SHA}' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="/home/eccops/apps/cst-website"
          STATE_DIR="/home/eccops/deploy-state/cst"
          STATE_FILE="${STATE_DIR}/last-successful-sha"

          CURRENT_SHA="$(
            git \
              -C "${APP_DIR}" \
              rev-parse HEAD
          )"

          if [ "${CURRENT_SHA}" != "${EXPECTED_SHA}" ]; then

            echo "❌ Impossible d'enregistrer le déploiement."
            echo "Attendu : ${EXPECTED_SHA}"
            echo "Présent : ${CURRENT_SHA}"

            exit 1
          fi

          mkdir -p "${STATE_DIR}"
          chmod 700 "${STATE_DIR}"

          TMP_FILE="$(
            mktemp \
              "${STATE_DIR}/last-successful-sha.XXXXXX"
          )"

          printf '%s\n' \
            "${EXPECTED_SHA}" \
            > "${TMP_FILE}"

          chmod 600 "${TMP_FILE}"

          mv \
            "${TMP_FILE}" \
            "${STATE_FILE}"

          echo
          echo "✅ Dernier déploiement réussi enregistré :"
          echo "${EXPECTED_SHA}"
          REMOTE

      # ============================================================
      # 17. RESUME DU DEPLOIEMENT
      # ============================================================
      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo
            echo "## ✅ Déploiement production réussi"
            echo
            echo "Commit : \`${GITHUB_SHA}\`"
            echo
            echo "Backend : \`${{ steps.changes.outputs.backend }}\`"
            echo "Frontend : \`${{ steps.changes.outputs.frontend }}\`"
            echo "Gateway : \`${{ steps.changes.outputs.gateway }}\`"
            echo
            echo "Les migrations Django et les endpoints publics ont été validés."
          } >> "${GITHUB_STEP_SUMMARY}"

      # ============================================================
      # 18. DIAGNOSTIC EN CAS D'ERREUR
      # ============================================================
      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          ssh cst-vps 'bash -se' <<'REMOTE' || true

          APP_DIR="/home/eccops/apps/cst-website"
          DOCKER_DIR="${APP_DIR}/docker"
          STATE_FILE="/home/eccops/deploy-state/cst/last-successful-sha"

          echo "===== DEPLOYMENT STATE ====="

          echo "Dernier succès :"
          cat "${STATE_FILE}" 2>/dev/null || echo "aucun"

          echo
          echo "Commit actuellement présent sur le VPS :"

          git \
            -C "${APP_DIR}" \
            rev-parse HEAD \
            2>/dev/null \
            || true

          echo
          echo "===== DOCKER PS ====="

          cd "${DOCKER_DIR}" || exit 0

          docker compose \
            --env-file .env.prod \
            -f docker-compose.prod.yml \
            ps \
            -a \
            || true

          echo
          echo "===== MIGRATIONS DJANGO ====="

          docker exec cst-backend \
            python manage.py showmigrations \
            2>&1 \
            || true

          echo
          echo "===== MIGRATION CHECK ====="

          docker exec cst-backend \
            python manage.py migrate --check \
            2>&1 \
            || true

          echo
          echo "===== BACKEND ====="

          docker logs \
            --tail=200 \
            cst-backend \
            || true

          echo
          echo "===== FRONTEND ====="

          docker logs \
            --tail=150 \
            cst-frontend \
            || true

          echo
          echo "===== CELERY ====="

          docker logs \
            --tail=120 \
            cst-celery-worker \
            || true

          echo
          echo "===== GATEWAY ====="

          docker logs \
            --tail=150 \
            cst-gateway \
            || true

          echo
          echo "===== ECC SHIELD ====="

          docker logs \
            --tail=150 \
            ecc-shield \
            || true

          REMOTE

