name: Deploy CST Production

on:
  push:
    branches:
      - feature-v2

  workflow_dispatch:

concurrency:
  group: cst-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy CST Production
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. VALIDATION DES SCRIPTS DE DEPLOIEMENT
      # ============================================================
      - name: Validate deployment scripts
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s docker/scripts/deploy-production.sh
          test -s docker/scripts/release-backend.sh
          test -s docker/docker-compose.prod.yml

          bash -n docker/scripts/deploy-production.sh
          bash -n docker/scripts/release-backend.sh

          echo "✅ Scripts de déploiement valides"

      # ============================================================
      # 3. PREPARATION SSH
      # ============================================================
      - name: Prepare SSH
        shell: bash
        env:
          CST_VPS_SSH_KEY: ${{ secrets.CST_VPS_SSH_KEY }}
          CST_VPS_KNOWN_HOSTS: ${{ secrets.CST_VPS_KNOWN_HOSTS }}
          CST_VPS_HOST: ${{ secrets.CST_VPS_HOST }}
          CST_VPS_PORT: ${{ secrets.CST_VPS_PORT }}
          CST_VPS_USER: ${{ secrets.CST_VPS_USER }}
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          test -n "${CST_VPS_SSH_KEY}"
          test -n "${CST_VPS_KNOWN_HOSTS}"
          test -n "${CST_VPS_HOST}"
          test -n "${CST_VPS_PORT}"
          test -n "${CST_VPS_USER}"

          printf "%s\n" "${CST_VPS_SSH_KEY}" > ~/.ssh/cst_vps_key
          sed -i 's/\r$//' ~/.ssh/cst_vps_key
          chmod 600 ~/.ssh/cst_vps_key

          # Vérifie que le secret contient bien une clé privée SSH exploitable.
          ssh-keygen -y \
            -f ~/.ssh/cst_vps_key \
            > /dev/null

          printf "%s\n" "${CST_VPS_KNOWN_HOSTS}" \
            > ~/.ssh/known_hosts

          sed -i 's/\r$//' ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF_SSH
          Host cst-vps
            HostName ${CST_VPS_HOST}
            User ${CST_VPS_USER}
            Port ${CST_VPS_PORT}
            IdentityFile ~/.ssh/cst_vps_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF_SSH

          chmod 600 ~/.ssh/config

          ssh cst-vps 'echo "✅ SSH CST OK"'

      # ============================================================
      # 4. DEPLOIEMENT PRODUCTION
      #
      # Toute la logique de release est versionnée dans le dépôt :
      # - verrou VPS avec flock ;
      # - synchronisation du SHA exact ;
      # - détection depuis le dernier déploiement réussi ;
      # - images Docker immuables par commit ;
      # - migrations Django dynamiques ;
      # - backup uniquement si des migrations sont réellement en attente ;
      # - activation ;
      # - healthchecks internes et publics ;
      # - enregistrement atomique du dernier SHA réussi.
      # ============================================================
      - name: Deploy production release
        shell: bash
        run: |
          set -Eeuo pipefail

          DEPLOY_BRANCH="feature-v2"
          FORCE_FULL=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            FORCE_FULL=true
          fi

          echo "Release SHA : ${GITHUB_SHA}"
          echo "Branche     : ${DEPLOY_BRANCH}"
          echo "Force full  : ${FORCE_FULL}"

          REMOTE_SCRIPT="/tmp/cst-deploy-${GITHUB_SHA}.sh"

          # Important : ne pas envoyer le script à `bash -s` via STDIN.
          # `docker compose run` est interactif par défaut et pourrait
          # consommer le reste du flux SSH, faisant terminer le déploiement
          # prématurément avec un faux succès.
          scp \
            docker/scripts/deploy-production.sh \
            "cst-vps:${REMOTE_SCRIPT}"

          ssh cst-vps \
            "chmod 700 '${REMOTE_SCRIPT}' && \
             RELEASE_SHA='${GITHUB_SHA}' \
             RELEASE_BRANCH='${DEPLOY_BRANCH}' \
             FORCE_FULL='${FORCE_FULL}' \
             bash '${REMOTE_SCRIPT}'; \
             rc=\$?; \
             rm -f '${REMOTE_SCRIPT}'; \
             exit \$rc"

      # ============================================================
      # 5. RESUME
      # ============================================================
      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## ✅ Déploiement CST réussi"
            echo
            echo "Commit : \`${GITHUB_SHA}\`"
            echo
            echo "La release a validé les migrations Django, les conteneurs,"
            echo "les routes internes et les endpoints HTTPS publics."
          } >> "${GITHUB_STEP_SUMMARY}"
