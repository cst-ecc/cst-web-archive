name: Deploy CST Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: cst-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CST to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.CST_VPS_SSH_KEY }}" > ~/.ssh/cst_vps_key
          chmod 600 ~/.ssh/cst_vps_key

          ssh-keyscan -p "${{ secrets.CST_VPS_PORT }}" -H "${{ secrets.CST_VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh \
            -i ~/.ssh/cst_vps_key \
            -p "${{ secrets.CST_VPS_PORT }}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.CST_VPS_USER }}@${{ secrets.CST_VPS_HOST }}" <<'REMOTE'
          set -euo pipefail

          APP_DIR="/home/eccops/apps/cst-website"
          COMPOSE_FILE="docker-compose.prod.yml"
          ENV_FILE=".env.prod"

          echo "[CST DEPLOY] Starting full-stack deployment..."

          cd "${APP_DIR}"

          echo "[CST DEPLOY] Fetching latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "[CST DEPLOY] Verifying production env file..."
          test -f "docker/${ENV_FILE}"

          cd docker

          echo "[CST DEPLOY] Checking Docker Compose config..."
          docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" config > /dev/null

          echo "[CST DEPLOY] Building images..."
          docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" build \
            cst_frontend cst_backend cst_gateway

          echo "[CST DEPLOY] Starting database and Redis..."
          docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" up -d cst_db cst_redis

          echo "[CST DEPLOY] Waiting for database and Redis..."
          sleep 10

          echo "[CST DEPLOY] Django check..."
          docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" run --rm cst_backend \
            python manage.py check

          echo "[CST DEPLOY] Applying migrations..."
          docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" run --rm cst_backend \
            python manage.py migrate --noinput

          echo "[CST DEPLOY] Starting application services..."
          docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" up -d --remove-orphans \
            cst_backend cst_celery_worker cst_frontend cst_gateway

          echo "[CST DEPLOY] Waiting for healthchecks..."
          sleep 20

          echo "[CST DEPLOY] Container status:"
          docker compose --env-file "${ENV_FILE}" -f "${COMPOSE_FILE}" ps

          echo "[CST DEPLOY] Testing internal gateway from ecc-shield..."
          docker exec ecc-shield wget -q -O /dev/null http://cst-gateway:8080/gateway-health
          docker exec ecc-shield wget -q -O /dev/null http://cst-gateway:8080/api/v1/health/

          echo "[CST DEPLOY] Testing public HTTPS..."
          curl -fsSI https://cst.ecc.bj > /dev/null
          curl -fsS https://cst.ecc.bj/api/v1/health/ > /dev/null

          echo "[CST DEPLOY] Deployment completed successfully."
          REMOTE
