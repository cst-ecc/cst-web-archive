# =============================================================
# Docker Compose — Développement CST
#
# Développement local uniquement.
# Expose le port 3000 sur la machine locale.
# =============================================================

name: cst_website_dev

services:
  cst_frontend_dev:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev

    container_name: cst-frontend-dev

    working_dir: /app

    ports:
      - "3000:3000"

    env_file:
      - .env.dev

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"

    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

    restart: unless-stopped

volumes:
  frontend_node_modules:
