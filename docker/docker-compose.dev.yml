# =============================================================
# Docker Compose — Développement (hot reload)
# Lancer depuis le dossier docker/ :
#   docker compose -f docker-compose.dev.yml up
# =============================================================

services:
  frontend:
    image: node:20-alpine
    container_name: cst-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Monte le code source du frontend (chemin relatif depuis docker/)
      - ../frontend:/app
      # Volume nommé pour node_modules : évite les conflits
      # host/container et persiste entre les redémarrages
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # Nécessaire pour le hot reload en Docker (volume monté)
      - WATCHPACK_POLLING=true

volumes:
  frontend_node_modules:
