# =============================================================
# Docker Compose — Production
# Lancer depuis le dossier docker/ :
#   docker compose up --build -d
# =============================================================

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cst-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped

