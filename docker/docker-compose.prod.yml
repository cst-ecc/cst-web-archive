# =============================================================
# Docker Compose — Production CST / CSMO
#
# À lancer depuis le dossier docker/ :
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Le trafic public doit passer par le reverse proxy externe ecc-shield,
# qui doit pointer cst.ecc.bj vers cst-gateway:8080.
# Ne pas exposer directement cst_frontend, cst_backend, PostgreSQL ou Redis.
# =============================================================

name: cst_website

services:
  cst_frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://cst.ecc.bj}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://cst-backend:8000/api/v1}
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-mock}
        NEXT_PUBLIC_NEWS_SOURCE: ${NEXT_PUBLIC_NEWS_SOURCE:-api}
        NEXT_PUBLIC_GALLERY_SOURCE: ${NEXT_PUBLIC_GALLERY_SOURCE:-api}
        NEXT_PUBLIC_DOCUMENTS_SOURCE: ${NEXT_PUBLIC_DOCUMENTS_SOURCE:-api}

    image: cst-frontend:latest
    container_name: cst-frontend

    env_file:
      - .env.prod

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://cst.ecc.bj}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://cst-backend:8000/api/v1}
      NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-mock}
      NEXT_PUBLIC_NEWS_SOURCE: ${NEXT_PUBLIC_NEWS_SOURCE:-api}
      NEXT_PUBLIC_GALLERY_SOURCE: ${NEXT_PUBLIC_GALLERY_SOURCE:-api}
      NEXT_PUBLIC_DOCUMENTS_SOURCE: ${NEXT_PUBLIC_DOCUMENTS_SOURCE:-api}

    expose:
      - "3000"

    networks:
      cst_internal:
        aliases:
          - cst-frontend
      # Transition de sécurité : peut être supprimé quand ecc-shield ne pointe
      # plus jamais directement vers cst-frontend:3000.
      ecc_proxy_network:
        aliases:
          - cst-frontend

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cst_db:
    image: postgres:16-alpine
    container_name: cst-db

    env_file:
      - .env.prod

    volumes:
      - cst_postgres_data:/var/lib/postgresql/data

    networks:
      cst_internal:
        aliases:
          - cst-db

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cst_redis:
    image: redis:7-alpine
    container_name: cst-redis

    command: redis-server --appendonly yes

    volumes:
      - cst_redis_data:/data

    networks:
      cst_internal:
        aliases:
          - cst-redis

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cst_backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    image: cst-backend:latest
    container_name: cst-backend

    env_file:
      - .env.prod

    expose:
      - "8000"

    volumes:
      - cst_media_data:/app/media
      - cst_static_data:/app/staticfiles

    networks:
      cst_internal:
        aliases:
          - cst-backend

    depends_on:
      cst_db:
        condition: service_healthy
      cst_redis:
        condition: service_healthy

    command: >
      sh -c "python manage.py collectstatic --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"

    restart: unless-stopped
  cst_celery_worker:
    image: cst-backend:latest
    container_name: cst-celery-worker

    env_file:
      - .env.prod

    command: >
      sh -c "celery -A config worker
             --loglevel=info
             --concurrency=$${CELERY_WORKER_CONCURRENCY:-2}"

    volumes:
      - cst_media_data:/app/media
      - cst_static_data:/app/staticfiles

    networks:
      cst_internal:
        aliases:
          - cst-celery-worker

    depends_on:
      cst_db:
        condition: service_healthy
      cst_redis:
        condition: service_healthy
      cst_backend:
        condition: service_healthy

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  cst_gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile

    image: cst-gateway:latest
    container_name: cst-gateway

    expose:
      - "8080"

    volumes:
      - cst_media_data:/srv/cst/media:ro
      - cst_static_data:/srv/cst/static:ro

    networks:
      cst_internal:
        aliases:
          - cst-gateway
      ecc_proxy_network:
        aliases:
          - cst-gateway

    depends_on:
      cst_frontend:
        condition: service_healthy
      cst_backend:
        condition: service_healthy

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gateway-health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  cst_postgres_data:
    name: cst_website_postgres_data
  cst_media_data:
    name: cst_website_media_data
  cst_redis_data:
    name: cst_website_redis_data
  cst_static_data:
    name: cst_website_static_data

networks:
  cst_internal:
    name: cst_website_internal
    driver: bridge

  # Réseau existant du reverse proxy principal ecc-shield.
  # Ne pas modifier ce réseau ni les services du recensement.
  ecc_proxy_network:
    external: true
    name: ecc2026_ecc_network
