# =============================================================
# Gateway interne du projet CST / CSMO
#
# Ce fichier appartient au dépôt CST. Il ne gère PAS TLS/Let's Encrypt.
# Le reverse proxy externe ecc-shield transmet cst.ecc.bj vers
# cst-gateway:8080.
#
# Upload galerie : chunké.
# Nginx n'a plus besoin d'accepter un POST de 1 Go.
# =============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $cst_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# =============================================================
# DNS Docker dynamique
#
# Les conteneurs frontend/backend peuvent changer d'adresse IP
# lors d'un déploiement. Nginx doit donc réinterroger le DNS
# interne Docker au lieu de conserver l'IP résolue au démarrage.
# =============================================================

resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream cst_frontend_upstream {
    zone cst_frontend_upstream 64k;

    server cst-frontend:3000 resolve;

    keepalive 16;
}

upstream cst_backend_upstream {
    zone cst_backend_upstream 64k;

    server cst-backend:8000 resolve;

    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    charset utf-8;
    server_tokens off;

    # Limite générale du gateway interne.
    # Les gros lots galerie sont découpés en chunks.
    client_max_body_size 55M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pages institutionnelles de secours.
    # - maintenance : activée uniquement par le fichier /etc/cst-maintenance/enabled ;
    # - system-error : erreurs générées par le gateway (upstream indisponible, timeout, etc.).
    error_page 500 502 504 /system-error.html;

    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "300" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location = /system-error.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Sonde frontend interne qui contourne volontairement le mode maintenance.
    # Elle permet de distinguer un frontend réellement en panne d'un site
    # volontairement placé en maintenance.
    location = /frontend-health {
        access_log off;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://cst_frontend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
    }

    # API publique et futures API protégées Django.
    location ^~ /api/ {
        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Admin Django temporaire.
    location ^~ /django-admin/ {
        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Upload chunké Galerie.
    # Avec GALLERY_CHUNK_SIZE_MB=8, une limite 20M couvre le multipart
    # sans accepter de requêtes massives.
    location ^~ /backoffice/gallery/uploads/ {
        client_max_body_size 20M;
        proxy_request_buffering off;

        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }

    # Documents : upload classique jusqu'à 100 Mo côté Django.
    location ^~ /backoffice/documents/ {
        client_max_body_size 120M;

        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 300s;
    }

    # Galerie : formulaire album, couverture et démarrage d'upload.
    location ^~ /backoffice/gallery/ {
        client_max_body_size 55M;

        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }

    # Back-office général.
    location ^~ /backoffice/ {
        client_max_body_size 55M;

        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Médias téléversés via Django.
    # Volume partagé en lecture seule côté gateway.
    location ^~ /media/ {
        alias /srv/cst/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static Django : admin + back-office.
    location ^~ /cst-static/ {
        alias /srv/cst/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Tout le reste est servi par le frontend Next.js.
    #
    # Pour activer la maintenance publique sans couper l'API ni le back-office :
    #   touch docker/maintenance/enabled
    # Pour la désactiver :
    #   rm -f docker/maintenance/enabled
    #
    # Le bind-mount est visible immédiatement par Nginx : aucun rebuild n'est
    # nécessaire après l'installation initiale de ce mécanisme.
    location / {
        error_page 503 /maintenance.html;

        if (-f /etc/cst-maintenance/enabled) {
            return 503;
        }

        proxy_pass http://cst_frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
