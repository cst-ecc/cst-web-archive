# =============================================================
# Gateway interne du projet CST / CSMO
#
# Ce fichier appartient au dépôt CST. Il ne gère PAS TLS/Let's Encrypt.
# Le reverse proxy externe ecc-shield transmet cst.ecc.bj vers
# cst-gateway:8080.
#
# Upload galerie : chunké.
# Nginx n'a plus besoin d'accepter un POST de 1 Go.
# =============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $cst_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream cst_frontend_upstream {
    server cst-frontend:3000;
    keepalive 16;
}

upstream cst_backend_upstream {
    server cst-backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    charset utf-8;
    server_tokens off;

    # Limite générale du gateway interne.
    # Les gros lots galerie sont découpés en chunks.
    client_max_body_size 55M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API publique et futures API protégées Django.
    location ^~ /api/ {
        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Admin Django temporaire.
    location ^~ /django-admin/ {
        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Upload chunké Galerie.
    # Avec GALLERY_CHUNK_SIZE_MB=8, une limite 20M couvre le multipart
    # sans accepter de requêtes massives.
    location ^~ /backoffice/gallery/uploads/ {
        client_max_body_size 20M;
        proxy_request_buffering off;

        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }

    # Documents : upload classique jusqu'à 100 Mo côté Django.
    location ^~ /backoffice/documents/ {
        client_max_body_size 120M;

        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 300s;
    }

    # Galerie : formulaire album, couverture et démarrage d'upload.
    location ^~ /backoffice/gallery/ {
        client_max_body_size 55M;

        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }

    # Back-office général.
    location ^~ /backoffice/ {
        client_max_body_size 55M;

        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Médias téléversés via Django.
    # Volume partagé en lecture seule côté gateway.
    location ^~ /media/ {
        alias /srv/cst/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Static Django : admin + back-office.
    location ^~ /cst-static/ {
        alias /srv/cst/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Tout le reste est servi par le frontend Next.js.
    location / {
        proxy_pass http://cst_frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
