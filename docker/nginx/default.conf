# =============================================================
# Gateway interne du projet CST / CSMO
#
# Upload galerie : désormais chunké.
# Nginx n'a plus besoin d'accepter un POST de 1 Go.
# Chaque chunk reste petit, contrôlé et reprenable.
# =============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $cst_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream cst_frontend_upstream {
    server cst-frontend:3000;
    keepalive 16;
}

upstream cst_backend_upstream {
    server cst-backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    charset utf-8;
    server_tokens off;

    # Limite générale. Les gros lots galerie ne passent plus ici en une seule
    # requête : ils sont découpés en chunks.
    client_max_body_size 55M;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /django-admin/ {
        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Chunks galerie.
    # Avec GALLERY_CHUNK_SIZE_MB=8, une limite 20M couvre largement le
    # multipart sans accepter de requêtes énormes.
    location ^~ /backoffice/gallery/uploads/ {
        client_max_body_size 20M;

        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }

    # Galerie : formulaire album et démarrage d'upload.
    # Les images multiples ne sont plus envoyées ici en un seul POST.
    location ^~ /backoffice/gallery/ {
        client_max_body_size 55M;

        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }

    location ^~ /backoffice/ {
        proxy_pass http://cst_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /media/ {
        alias /srv/cst/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /cst-static/ {
        alias /srv/cst/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://cst_frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $cst_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
